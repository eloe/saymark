name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified CI linters
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_VERSION: 0.11.0
        run: |
          tools="$RUNNER_TEMP/saymark-ci-tools"
          mkdir -p "$tools"

          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$actionlint_archive"
          echo "$ACTIONLINT_SHA256  $actionlint_archive" | sha256sum --check
          tar -xzf "$actionlint_archive" -C "$tools" actionlint

          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$shellcheck_archive"
          echo "$SHELLCHECK_SHA256  $shellcheck_archive" | sha256sum --check
          tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$tools/shellcheck"

          echo "$tools" >> "$GITHUB_PATH"

      - name: Lint workflows and shell automation
        run: Scripts/check-ci-config.sh

  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Legal notices
        run: Scripts/check-legal-notices.sh

      - name: Current-tree and history credential policy
        run: Scripts/security-audit.sh

      - name: App dependency lock agreement
        run: node Scripts/check-app-dependencies.mjs

      - name: Generated architecture agreement
        run: node Scripts/generate-architecture-map.mjs --check

      - name: Live insertion policy boundary
        run: Scripts/check-live-insertion-policy-boundary.sh

      - name: SemVer 2 release policy
        run: Scripts/check-release-version.sh

      - name: Daily-driver diagnostic acceptance contract
        run: node Scripts/test-daily-driver-diagnostics.mjs

  swift:
    name: Swift core and app tests
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Verify the pinned Apple toolchain
        run: Scripts/check-xcode-version.sh 26.5 17F42

      - name: Validate zsh automation
        run: Scripts/check-zsh-syntax.sh

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Test SaymarkKit without real model downloads
        working-directory: SaymarkKit
        run: swift test -c release --disable-automatic-resolution

      - name: Test the vendored KeyboardShortcuts patch
        run: swift test --package-path Vendor/KeyboardShortcuts --disable-automatic-resolution

      - name: Generate the local app project
        env:
          TUIST_SAYMARK_LOCAL_BUILD: "1"
          TUIST_APP_VERSION: "0.1.1"
          TUIST_APP_BUILD: ${{ github.run_number }}
        run: tuist generate --no-open

      - name: Test the app and HUD
        run: |
          xcodebuild test \
            -workspace Saymark.xcworkspace \
            -scheme Saymark \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/saymark-app-tests" \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:SaymarkTests \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

  ui:
    name: End-to-end macOS UI tests
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Verify the pinned Apple toolchain
        run: Scripts/check-xcode-version.sh 26.5 17F42

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate the local app project
        env:
          TUIST_SAYMARK_LOCAL_BUILD: "1"
          TUIST_APP_VERSION: "0.1.1"
          TUIST_APP_BUILD: ${{ github.run_number }}
        run: tuist generate --no-open

      - name: Exercise onboarding and daily-driver flows
        run: |
          xcodebuild test \
            -workspace Saymark.xcworkspace \
            -scheme Saymark \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/saymark-ui-tests" \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:SaymarkUITests \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Summarize UI test results
        if: ${{ always() }}
        run: Scripts/report-xcresult.sh "$RUNNER_TEMP/saymark-ui-tests" || true

  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Block newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true

  gate:
    name: Quality policy gate
    needs: [lint, policy, swift, ui, dependency_review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable quality check
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          for result_name in LINT_RESULT POLICY_RESULT SWIFT_RESULT UI_RESULT; do
            [[ "${!result_name}" == "success" ]] ||
              { echo "$result_name was ${!result_name}; expected success." >&2; exit 1; }
          done

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] ||
              { echo "Dependency review was $DEPENDENCY_REVIEW_RESULT; expected success." >&2; exit 1; }
          else
            [[ "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]] ||
              { echo "Dependency review was $DEPENDENCY_REVIEW_RESULT; expected skipped." >&2; exit 1; }
          fi

          echo "Every applicable quality check passed."
