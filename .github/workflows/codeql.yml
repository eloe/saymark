name: CodeQL

on:
  push:
    tags:
      - "saymark-v*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "31 14 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify CodeQL scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      query_suite: ${{ steps.scope.outputs.query_suite }}
      run_codeql: ${{ steps.scope.outputs.run_codeql }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select scan depth from the event and changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            echo "run_codeql=false" >> "$GITHUB_OUTPUT"
            echo "query_suite=default" >> "$GITHUB_OUTPUT"
            echo "Skipping traced Swift build while the pull request is a draft."
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_codeql=true" >> "$GITHUB_OUTPUT"
            echo "query_suite=security-extended" >> "$GITHUB_OUTPUT"
            echo "Full extended scan required for $EVENT_NAME."
            exit 0
          fi

          echo "query_suite=default" >> "$GITHUB_OUTPUT"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" \
            > "$RUNNER_TEMP/codeql-changed-paths"

          run_codeql=false
          while IFS= read -r -d '' path; do
            if Scripts/codeql-path-is-relevant.sh "$path"; then
              echo "CodeQL-relevant change: $path"
              run_codeql=true
            fi
          done < "$RUNNER_TEMP/codeql-changed-paths"

          echo "run_codeql=$run_codeql" >> "$GITHUB_OUTPUT"
          if [[ "$run_codeql" == "false" ]]; then
            echo "Skipping traced Swift build: no Swift or build inputs changed."
          fi

  analyze:
    name: Swift security analysis
    needs: classify
    if: needs.classify.outputs.run_codeql == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Verify the pinned Apple toolchain
        run: Scripts/check-xcode-version.sh 26.5 17F42

      - name: Generate the local project
        env:
          TUIST_SAYMARK_LOCAL_BUILD: "1"
          TUIST_APP_VERSION: "0.1.1"
          TUIST_APP_BUILD: ${{ github.run_number }}
        run: tuist generate --no-open

      # macos-26 runners do not include this optional Xcode component, but the
      # MLX Swift dependency compiles Metal sources. Install it before CodeQL
      # enables its DYLD tracer so xcodebuild's component action is untraced.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Xcode 26 ships `metal` as a shim that discovers a separately mounted
      # toolchain. CodeQL's DYLD tracer prevents that discovery even after the
      # component is installed. Prepare the direct shim before initialization
      # so discovery itself is not slowed by the tracer. The generated shim
      # still removes the tracer only from Metal; Swift remains traced.
      - name: Make the mounted Metal compiler available to the traced build
        run: |
          real_metal="$(
            find /var/run/com.apple.security.cryptexd/mnt \
              -path '*/Metal.xctoolchain/usr/bin/metal' \
              -type f -print -quit 2>/dev/null
          )"
          [[ -n "$real_metal" && -x "$real_metal" ]] ||
            { echo "Mounted Metal compiler not found" >&2; exit 1; }
          metal_shim="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin/metal"
          sudo mv "$metal_shim" "${metal_shim}.saymark-original"
          printf '#!/bin/bash\nunset DYLD_INSERT_LIBRARIES\nexec %q "$@"\n' "$real_metal" |
            sudo tee "$metal_shim" >/dev/null
          sudo chmod 0755 "$metal_shim"
          "$metal_shim" --version

      # Initialize only after Tuist runs. CodeQL's DYLD tracer prevents Tuist
      # from locating its bundled ProjectDescription resource on hosted macOS.
      # The default query suite is implicit in advanced setup. The `queries`
      # input is only for additional suites, so omit it entirely on pull
      # requests instead of passing the unsupported string "default".
      - name: Initialize CodeQL with the default query suite
        if: needs.classify.outputs.query_suite == 'default'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Initialize CodeQL with the extended query suite
        if: needs.classify.outputs.query_suite == 'security-extended'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build traced Swift
        run: |
          xcodebuild build \
            -workspace Saymark.xcworkspace \
            -scheme Saymark \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived-data" \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            SWIFT_COMPILATION_MODE=singlefile \
            GCC_OPTIMIZATION_LEVEL=0 \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: /language:swift

  gate:
    name: CodeQL policy gate
    needs: [classify, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected CodeQL policy
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUN_CODEQL: ${{ needs.classify.outputs.run_codeql }}
        run: |
          [[ "$CLASSIFY_RESULT" == "success" ]] ||
            { echo "CodeQL scope classification failed." >&2; exit 1; }

          if [[ "$RUN_CODEQL" == "true" ]]; then
            [[ "$ANALYZE_RESULT" == "success" ]] ||
              { echo "Required Swift CodeQL analysis did not succeed." >&2; exit 1; }
            echo "Required Swift CodeQL analysis succeeded."
          else
            [[ "$ANALYZE_RESULT" == "skipped" ]] ||
              { echo "Unexpected CodeQL result for a skipped scan: $ANALYZE_RESULT" >&2; exit 1; }
            echo "Swift CodeQL correctly skipped: no Swift or build inputs changed."
          fi
