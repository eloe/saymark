name: Dependency graph

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub's dependency submission API requires repository Contents write.
# No source, release, secret, or package mutation is performed.
permissions:
  contents: write

jobs:
  submit-tuist-dependencies:
    name: Submit Tuist dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate resolved Swift dependency snapshot
        run: |
          node Scripts/generate-dependency-snapshot.mjs \
            Tuist/Package.resolved \
            "$RUNNER_TEMP/dependency-snapshot.json"
          jq -e '
            .manifests["Tuist/Package.resolved"].resolved
            | length == 2
          ' "$RUNNER_TEMP/dependency-snapshot.json" >/dev/null

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/dependency-snapshot.json"
