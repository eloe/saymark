<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saymark Synthetic Target</title>
  <style>
    body { font: 18px system-ui; margin: 48px; max-width: 720px; }
    label { display: block; margin: 24px 0 8px; }
    input, textarea { box-sizing: border-box; font: inherit; width: 100%; padding: 12px; }
    textarea { min-height: 180px; }
  </style>
</head>
<body>
  <h1>Saymark synthetic target</h1>
  <label for="single">Single-line synthetic field</label>
  <input id="single" autofocus autocomplete="off">
  <label for="multi">Multiline synthetic field</label>
  <textarea id="multi"></textarea>
</body>
</html>
